    <div class="btns"><button class="btn" id="lob-create" type="button">ルームを作る</button><button class="btn ghost" id="lob-back" type="button">戻る</button></div>
    ${P2P
      ? `<div class="field"><label for="lob-code">ルームコードで参加</label><div class="code-row"><input id="lob-code" maxlength="6" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例：k3v6q"><button class="btn small" id="lob-join" type="button">参加</button></div></div>`
      : `<div class="hud-title">開いているルーム</div>`}
    <div class="rooms" id="lob-rooms"></div>
    <p class="note" id="lob-status"></p>`;
  overlay.hidden=false;
  const inp=bindNameField();
  const newCode=()=>Math.random().toString(36).slice(2,2+(P2P?5:4)).padEnd(P2P?5:4,'0');
  el('lob-create').addEventListener('click',()=>enterRoom(newCode(),true));
  el('lob-back').addEventListener('click',()=>{ leaveLobby(); showTitle(); });
  el('lob-rooms').addEventListener('click',e=>{ const b=e.target.closest('button[data-code]'); if(b) enterRoom(b.dataset.code,false); });
  if(P2P){
    const ci=el('lob-code');
    const go=()=>{ const v=String(ci.value||'').trim().toLowerCase(); if(/^[a-z0-9]{4,6}$/.test(v)) enterRoom(v,false); else roomStatus('ルームコードは英数字4〜6文字です。'); };
    el('lob-join').addEventListener('click',go);
    ci.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  }
  lobbyPresence(); renderLobby();
  inp.focus();
}
function renderLobby(){
  if(NET.inRoom) return renderRoom();
  if(!NET.inLobby || !el('lob-rooms')) return;
  if(P2P){
    roomStatus('ルームを作ると、参加用のコードが出ます。そのコードを一緒に遊ぶ人に伝えてください。');
    el('lob-create').disabled=false;
    return;
  }
  const peers=room ? room.peers() : [];
  const ads=peers.map(p=>p.presence && p.presence.adv).filter(a=>a && /^[a-z0-9]{4}$/.test(a.code));
  const html = ads.length
    ? ads.map(a=>`<div class="room-row"><span><b>${esc(cleanName(a.host)||'ホスト')}のルーム</b><small>コード ${a.code} ・ 人 ${clampN(a.n,0,4)|0}/4</small></span><button class="btn small" type="button" data-code="${a.code}">参加</button></div>`).join('')
    : '<p class="note">まだルームがありません。「ルームを作る」で作れます。</p>';
  if(html!==NET.lobbyHtml){ NET.lobbyHtml=html; el('lob-rooms').innerHTML=html; }
  if(!room) roomStatus('この画面ではオンライン機能を使えません。claude.ai にサインインした状態で、共有されたリンクから開いてください。');
  else if(!room.connected()) roomStatus('接続中…');
  else roomStatus(`いまこのページを開いている人：${peers.length}人`);
  el('lob-create').disabled=!room;
}
function leaveLobby(){ leaveRoom(); NET.inLobby=false; lobbyPresence(); }

// ルームに入る（作った人がホスト）
async function enterRoom(code,host){
  if(!room) return;
  let R;
  roomStatus(host ? 'ルームを作っています…' : 'ルームに接続しています…');
  try{ R=await room.join('baiyou-'+code, host); }
  catch(e){ roomStatus((P2P && e && e.message ? e.message+'。' : 'ルームに入れませんでした。')+'少し待ってからもう一度試してください。'); return; }
  Object.assign(RM,{code, R, host, ai:[false,false,false,false], seat:host?0:-1, cdAt:0, blocked:false, lastCd:null, lastN:-1, html:''});
  NET.inLobby=false; NET.inRoom=true; NET.liveG=null;
  R.on('start',onStart); R.on('snap',onSnap); R.on('food',onFood); R.on('ev',onEv); R.on('end',onEnd);
  R.onPeers(()=>renderRoom());
  showRoom(); roomPresence(); lobbyPresence();
}
function leaveRoom(){
  if(RM.R) RM.R.leave().catch(()=>{});
  Object.assign(RM,{code:null, R:null, host:false, seat:-1, cdAt:0, lastN:-1});
  NET.inRoom=false;
}
function roomPresence(){
  if(!RM.R) return;
  const cd = RM.host && RM.cdAt ? Math.max(0,Math.ceil((RM.cdAt-performance.now())/1000)) : null;
  RM.R.presence({seat:RM.seat, name:LOB.name, host:RM.host||null, ai:RM.host?RM.ai:null, cd, here:NET.inRoom?1:null, g:null, in:null}).catch(()=>{});
}
// 席の状態：人（先に座った人）＞ AI（ホストの設定）＞ 空き
function seatsState(){
  const peers=RM.R ? RM.R.peers() : [];
  const hostP=peers.find(p=>p.presence && p.presence.host);
  const ai=hostP && Array.isArray(hostP.presence.ai) ? [0,1,2,3].map(i=>!!hostP.presence.ai[i]) : [false,false,false,false];
  const st=[0,1,2,3].map(i=>({kind:ai[i]?'ai':'open'}));
  for(const p of peers){
    const s=p.presence && p.presence.seat;
    if(!(Number.isInteger(s) && s>=0 && s<4) || st[s].kind==='human') continue;
    // away：席はあるが、まだ前の対戦の結果画面を見ている（ルーム画面に戻っていない）
    st[s]={kind:'human', peer:p.peer, name:cleanName(p.presence.name), me:p.sameTab, away:!p.sameTab && !p.presence.here};
  }
  return {st, hostP, cd:hostP ? hostP.presence.cd : null};
}
function showRoom(){
  card.innerHTML=`
    <div class="eyebrow">オンライン対戦 ／ ルーム ${RM.code}</div>
    <h1>${RM.host ? 'あなたのルーム' : 'ルーム'}</h1>
    <p class="lead" id="room-lead"></p>
    ${nameField()}
    ${RM.host ? aiLevelField() : ''}
    <div class="seats" id="room-seats"></div>
    <p class="note" id="lob-status"></p>
    <div class="btns"><button class="btn ghost" id="lob-live" type="button" hidden>進行中の対戦を観戦</button><button class="btn ghost" id="room-leave" type="button">ルームを出る</button></div>`;
  overlay.hidden=false;
  bindNameField(); bindAiLevel();
  el('room-seats').addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const s=+b.dataset.seat;
    if(b.dataset.act==='sit') RM.seat=s;
    else if(b.dataset.act==='stand') RM.seat=-1;
    else if(RM.host){ RM.ai[s]=b.dataset.act==='ai'; RM.blocked=false; }
    roomPresence(); renderRoom();
  });
  el('lob-live').addEventListener('click',()=>{ if(NET.liveG) beginNet('client',NET.liveG,{},['','','',''],-1); });
  el('room-leave').addEventListener('click',()=>{ leaveRoom(); showLobby(); });
  RM.html=''; renderRoom();
}
function renderRoom(){
  if(!NET.inRoom || !el('room-seats')) return;
  const {st,hostP,cd}=seatsState();
  // 自分が選んだ席に先客がいたら、座っていない状態に戻す
  if(RM.seat>=0 && st[RM.seat].kind==='human' && !st[RM.seat].me){ RM.seat=-1; roomPresence(); }
  const html=st.map((s,i)=>{
    const f=FACTIONS[i], who = s.kind==='human' ? esc(s.name||'名前なし')+(s.me?'（あなた）':'')+(s.away?'（結果画面を見ています）':'') : s.kind==='ai' ? 'AI' : '空き';
    const acts=[];
    if(s.kind!=='human') acts.push(`<button type="button" class="mini" data-act="sit" data-seat="${i}">ここに座る</button>`);
    if(s.me) acts.push(`<button type="button" class="mini" data-act="stand" data-seat="${i}">席を立つ</button>`);
    if(RM.host && s.kind!=='human') acts.push(`<button type="button" class="mini" data-act="${s.kind==='ai'?'open':'ai'}" data-seat="${i}">${s.kind==='ai'?'空きにする':'AIにする'}</button>`);
    return `<div class="seat-card ${s.kind}${s.me?' mine':''}"><b><i style="background:${f.color}"></i>${f.name}</b><small>${who}</small><div class="acts">${acts.join('')}</div></div>`;
  }).join('');
  if(html!==RM.html){ RM.html=html; el('room-seats').innerHTML=html; }
  const open=st.filter(s=>s.kind==='open').length, away=st.filter(s=>s.away).length;
  el('room-lead').textContent = RM.host
    ? (P2P ? `あなたがホストです。ルームコード「${RM.code}」を一緒に遊ぶ人に伝えてください。` : `あなたがホストです。ほかの人はロビーの一覧からこのルームに参加できます。`)
      + `空いた席は「AIにする」でAIに任せられます。対戦中のゲームはあなたの画面で動くので、終わるまでこのタブを開いたままにしてください。`
    : `ホスト：${hostP ? (cleanName(hostP.presence.name)||'名前なし') : '（いません）'}。空いている席を選んで座ってください。`;
  if(!hostP && !RM.host) roomStatus('ホストがルームにいません。ルームを出て、作り直してください。');
  else if(cd!=null) roomStatus(`全員そろいました。開始まで ${cd} 秒`);
  else if(RM.blocked && RM.host) roomStatus(RM.blockMsg||'開始できませんでした。');
  else if(away && !open) roomStatus(`${away}人がまだ前の対戦の結果画面を見ています。全員がルームに戻ると始まります。`);
  else roomStatus(open ? `あと${open}席。すべての席が人かAIで埋まると、3秒後に始まります。` : '人が1人以上座ると始まります。');
  el('lob-live').hidden=!(NET.liveG && performance.now()-NET.liveAt<3000);
}
// ホスト：席がそろったら3秒数えて開始。途中で崩れたら数え直す
function roomTick(now){
  if(!RM.host || !RM.R) return;
  const {st}=seatsState(), humans=st.filter(s=>s.kind==='human').length;
  const full=humans>0 && st.every(s=>s.kind!=='open' && !s.away);
  if(!full){ RM.cdAt=0; RM.blocked=false; }
  else if(!RM.cdAt && !RM.blocked) RM.cdAt=now+3000;
  const cd=RM.cdAt ? Math.max(0,Math.ceil((RM.cdAt-now)/1000)) : null;
  if(cd!==RM.lastCd || humans!==RM.lastN){ RM.lastCd=cd; RM.lastN=humans; roomPresence(); lobbyPresence(); }
  if(RM.cdAt && now>=RM.cdAt){ RM.cdAt=0; RM.blocked=true; hostStart(st); }
}
async function hostStart(st){
  const seats={}, names=['','','',''];
  st.forEach((s,i)=>{ if(s.kind==='human'){ seats[s.peer]=i; names[i]=s.name||('プレイヤー'+(i+1)); } });
  const mine=st.findIndex(s=>s.me);
  const g=Math.random().toString(36).slice(2,10);
  try{ await RM.R.emit('start',{g,seats,names}); }
  catch(e){
    RM.blockMsg = e && e.code==='not_permitted'
      ? '対戦を開始できるのは、このページの共同編集者（Contributor）以上の人だけです。開始できる人にルームを作ってもらってください。'
      : '開始できませんでした。席を座り直すともう一度数え始めます。';
    renderRoom(); return;
  }
  beginNet('host',g,seats,names,mine);
}
function onStart(m){
  const d=m.data; if(m.sameTab || !d || typeof d!=='object' || !NET.inRoom || !RM.R) return;
  const me=RM.R.peers().find(p=>p.sameTab), seats=d.seats && typeof d.seats==='object' ? d.seats : {};
  const seat=me && seats[me.peer]!==undefined ? Math.min(3,seats[me.peer]|0) : -1;
  beginNet('client', String(d.g||''), seats, Array.isArray(d.names)?d.names:['','','',''], seat);
}
function beginNet(role,g,seats,names,me){
  NET.inLobby=false; NET.inRoom=false; RM.host=role==='host' && RM.host; lobbyPresence();
  if(RM.R) RM.R.presence({here:null}).catch(()=>{});
  NET.g=g; NET.seats={}; for(const k in seats) NET.seats[k]=Math.min(3,Math.max(0,seats[k]|0));
  NET.lastRecv=performance.now(); NET.snapAt=0; NET.buf=null; NET.fbuf=null; NET.applied=0; NET.fapplied=0; NET.lastSnap=0; NET.lastFood=0;
  const hum=[0,1,2,3].map(s=>Object.values(NET.seats).includes(s));
  overlay.hidden=true; setWatchUI(false);
  newGame(false,false,{net:role, me:me??-1, hum, names:[0,1,2,3].map(i=>cleanName(names[i]))});
  if(role==='client'){ cells=[]; foods=[]; dnas=[]; shots=[]; S.leaders=[null,null,null,null]; }
  el('sec-mode').hidden=ME<0; el('my-stats').hidden=ME<0;
  toast(ME>=0 ? `${FACTIONS[ME].name}として参加` : '観戦として参加');
  if(role==='host') startBgClock();
}
// ---------- claude.ai の外（普通のWebサイト）での通信：WebRTC（PeerJS） ----------
// アカウントなしで遊べるように、ブラウザ同士を直接つなぐ。ホストの画面が中継役になる星形のつながりで、
// ゲーム側からは room 機能と同じ呼び方（emit / on / presence / peers / onPeers / join / leave）で使える。
// 最初の顔合わせだけ PeerJS の無料サーバーを使う。ルームの一覧はないので、ホストが表示するコードで参加する
function makeP2PRoom(){
  let handlers={}, peersCbs=[], baseCbs=null;
  const connCbs=[];
  let peer=null, me=null, isHost=false, hostConn=null, conns=new Map(), table=new Map(), list=[], myPres={}, up=false;
  let presTimer=null, bcastTimer=null;
  const info=p=>({peer:p, by:null, isMe:p===me, sameTab:p===me, kind:'viewer', guest:false});
  const deliver=(topic,data,from)=>{ for(const f of handlers[topic]||[]){ try{ f({...info(from),topic,data}); }catch(e){} } };
  const snapshot=()=>{
    if(me) table.set(me,{...myPres});
    list=[...table.entries()].map(([p,pr])=>({...info(p),presence:pr||{},updatedAt:Date.now()}));
    const ch={peers:list,joined:[],left:[],updated:[]};
    for(const f of peersCbs){ try{ f(ch); }catch(e){} }
  };
  const setUp=v=>{ up=v; for(const f of connCbs){ try{ f(v); }catch(e){} } };
  // ホスト：全員の presence を1秒に約10回まとめて配る
  const bcastPeers=()=>{ if(bcastTimer) return; bcastTimer=setTimeout(()=>{ bcastTimer=null; const arr=[...table.entries()]; for(const c of conns.values()) if(c.open) c.send({t:'peers',list:arr}); },100); };
  function onData(from,m){
    if(!m || typeof m!=='object') return;
    if(isHost){
      if(m.t==='pres'){ table.set(from, m.presence && typeof m.presence==='object' ? m.presence : {}); snapshot(); bcastPeers(); }
      else if(m.t==='emit' && typeof m.topic==='string'){ for(const c of conns.values()) if(c.open) c.send({t:'emit',topic:m.topic,data:m.data,from}); deliver(m.topic,m.data,from); }
    } else {
      if(m.t==='peers' && Array.isArray(m.list)){ table=new Map(m.list.filter(e=>Array.isArray(e)&&typeof e[0]==='string')); snapshot(); }
      else if(m.t==='emit' && typeof m.topic==='string') deliver(m.topic,m.data,String(m.from||''));
    }
  }
  const api={
    connected:()=>up,
    onConnection(f){ connCbs.push(f); setTimeout(()=>f(up),0); return ()=>{}; },
    onPeers(f){ peersCbs.push(f); return ()=>{}; },
    on(t,f){ (handlers[t]=handlers[t]||[]).push(f); return ()=>{}; },
    peers:()=>list,
    emit(topic,data){
      if(!up) return Promise.resolve();
      if(isHost){ for(const c of conns.values()) if(c.open) c.send({t:'emit',topic,data,from:me}); deliver(topic,data,me); }
      else if(hostConn && hostConn.open) hostConn.send({t:'emit',topic,data});
      return Promise.resolve();
    },
    presence(patch){
      for(const k in patch){ if(patch[k]===null) delete myPres[k]; else myPres[k]=patch[k]; }
      if(presTimer) return Promise.resolve();
      // 1秒に約30回までにまとめて送る
      presTimer=setTimeout(()=>{ presTimer=null;
        if(isHost){ snapshot(); bcastPeers(); }
        else if(hostConn && hostConn.open) hostConn.send({t:'pres',presence:myPres});
      },33);
      return Promise.resolve();
    },
    // 名前（コード）の部屋に入る。asHost なら部屋を開き、そうでなければホストにつなぐ
    join(name,asHost){
      api.leave();
      if(!baseCbs) baseCbs=peersCbs.slice();
      handlers={}; peersCbs=baseCbs.slice();
      isHost=!!asHost;
      const id='baiyou-sensen-'+String(name).replace(/^baiyou-/,'');
      return new Promise((res,rej)=>{
        let done=false;
        const fail=e=>{ if(done) return; done=true; api.leave(); rej({code:'upstream_error', message:e&&e.type==='unavailable-id' ? 'そのコードはもう使われています' : e&&e.type==='peer-unavailable' ? 'ルームが見つかりません（コードが違うか、ホストがいません）' : 'つながりませんでした'}); };
        try{ peer = isHost ? new window.Peer(id) : new window.Peer(); }catch(e){ fail(e); return; }
        peer.on('error',fail);
        peer.on('open',pid=>{
          me=pid;
          if(isHost){
            peer.on('connection',c=>{
              c.on('open',()=>{ conns.set(c.peer,c); table.set(c.peer,{}); snapshot(); bcastPeers(); });
              c.on('data',m=>onData(c.peer,m));
              c.on('close',()=>{ conns.delete(c.peer); table.delete(c.peer); snapshot(); bcastPeers(); });
            });
            done=true; setUp(true); snapshot(); res(api);
          } else {
            const c=peer.connect(id,{reliable:true,serialization:'json'}); hostConn=c;
            const to=setTimeout(()=>fail({type:'peer-unavailable'}),10000);
            c.on('open',()=>{ clearTimeout(to); done=true; setUp(true); c.send({t:'pres',presence:myPres}); snapshot(); res(api); });
            c.on('data',m=>onData(id,m));
            c.on('close',()=>{ setUp(false); table=new Map(); snapshot(); });
          }
        });
      });
    },
    leave(){
      try{ if(peer) peer.destroy(); }catch(e){}
      peer=null; hostConn=null; conns=new Map(); table=new Map(); list=[]; me=null;
      if(up) setUp(false);
      return Promise.resolve();
    },
  };
  return api;
}
// claude.ai の中では room 機能、外では PeerJS が読み込めていれば WebRTC を使う
const P2P = !(window.claude && window.claude.use) && typeof window.Peer==='function';
(window.claude && window.claude.use ? window.claude.use('room') : Promise.resolve(P2P ? makeP2PRoom() : null)).then(r=>{
  room=r; if(!r) return;
  r.onPeers(()=>renderLobby());
  r.onConnection(()=>renderLobby());
}).catch(()=>{});

// ---------- loop ----------
let last=performance.now();
// ホストのタブが裏に回ると requestAnimationFrame が止まるので、その間は Web Worker の時計でゲームを進めて配り続ける
// （Worker の時計は裏のタブでもほとんど間引かれない）。「裏に回った」の判定は document.hidden に頼らず、
// 画面の更新が0.25秒以上止まっているかで見る（裏でも hidden にならない環境があるため）。表に戻ったら通常のループに戻る
let bgWorker=null, lastRaf=performance.now();
function startBgClock(){
  if(bgWorker || typeof Worker==='undefined' || typeof Blob==='undefined') return;
  try{
    const url=URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'],{type:'text/javascript'}));
    bgWorker=new Worker(url);
    bgWorker.onmessage=()=>{
      if(S.net!=='host' || S.over || performance.now()-lastRaf<250) return;
      const now=performance.now(), dt=Math.min(.05,(now-last)/1000); last=now;
      update(dt); hostBroadcast(now);
    };
  }catch(e){ bgWorker=null; }
}
function frame(now){
  lastRaf=performance.now();
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(S.net==='client'){ if(!S.over) clientFrame(dt); }
  else if(!S.over){ const n=(S.watch||S.spectate) && !S.net ? S.speed : 1; for(let i=0;i<n && !S.over;i++) update(dt); }
  if(S.net==='host' && !S.over) hostBroadcast(now);
  if(NET.inRoom) roomTick(now);
  if((NET.inLobby||NET.inRoom) && (now|0)%500<20) renderLobby();
  render();
  hudT-=dt; if(hudT<=0){ hudT=.2; updateHUD(); }
  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.classList.remove('show'); }
  requestAnimationFrame(frame);
}
newGame(true);
showTitle();
requestAnimationFrame(frame);
})();
</script>
